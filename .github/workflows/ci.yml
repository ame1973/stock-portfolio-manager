name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.25'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: npm ci
      - run: make check
      - run: npm audit --audit-level=moderate
      - run: git diff --exit-code
      - name: Verify Docker topology
        run: docker compose config --quiet
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Verify credential-safe browser failure diagnostics
        run: npm run test:e2e:privacy
      - name: Verify isolated real credential browser workflows
        run: npm run test:e2e:credentials
      - name: Verify isolated trade-origin recovery browser workflow
        run: npm run test:e2e:trade-origin
      - name: Build containers
        run: docker compose -p spm-e2e-ci build
      - name: Smoke test containers
        run: |
          docker compose -p spm-e2e-ci up -d --wait --wait-timeout 120
          curl --fail http://127.0.0.1:8080/api/v1/health/ready
      - name: Browser onboarding, master data, and session security
        env:
          SPM_E2E_COMPOSE_PROJECT: spm-e2e-ci
          SPM_E2E_BASE_URL: http://localhost:8080
        run: npm run test:e2e
      - name: Container logs on failure
        if: failure()
        run: docker compose -p spm-e2e-ci logs --no-color
      - name: Stop isolated CI containers
        if: always()
        run: docker compose -p spm-e2e-ci down
