openapi: 3.1.0
info:
  title: Stock Portfolio Manager 2.0 API
  version: 1.0.0-spec
  description: Greenfield source-of-truth HTTP contract. All monetary/quantity values are decimal strings;
    live provider coverage not guaranteed.
servers:
- url: /
  description: Same-origin NAS reverse proxy
security:
- cookieAuth: []
paths:
  /api/v1/setup/status:
    get:
      tags:
      - Setup
      operationId: get_setup_status
      summary: Get Setup Status
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
        '400': &id001
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': &id002
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id003
          description: Forbidden/CSRF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': &id004
          description: Business conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412': &id005
          description: Version mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': &id006
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': &id007
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': &id008
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters: []
      security: []
  /api/v1/setup/initialize:
    post:
      tags:
      - Setup
      operationId: initialize_owner
      summary: Initialize Owner
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '400': *id001
        '401': *id002
        '403': *id003
        '409': *id004
        '412': *id005
        '422': *id006
        '429': *id007
        '503': *id008
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupInitialize'
      security: []
      description: Requires one-time secret issued via NAS CLI/log; Origin and rate limiting required.
