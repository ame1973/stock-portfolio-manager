components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: spm_session
      description: HttpOnly/Secure/SameSite cookie; state changes require CSRF header.
  schemas:
    Money:
      type: string
      pattern: ^-?\d+(\.\d{1,6})?$
      example: '123.450000'
      description: Decimal string in currency units, never binary float.
    Quantity:
      type: string
      pattern: ^\d+(\.\d{1,8})?$
      example: '10.00000000'
      description: Decimal shares string, max 8 fractional digits.
    Price:
      type: string
      pattern: ^\d+(\.\d{1,8})?$
      example: '1.25000000'
    FxRate:
      type: string
      pattern: ^\d+(\.\d{1,12})?$
      example: '7.812345678901'
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
      - request_id
    Status:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
        request_id:
          type: string
      required:
      - status
    Success:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
        message:
          type: string
      required:
      - ok
    Id:
      type: object
      additionalProperties: false
      properties:
        id: &id009
          type: string
          format: uuid
      required:
      - id
    Owner:
      type: object
      additionalProperties: false
      properties:
        id: *id009
        created_at: &id010
          type: string
          format: date-time
        is_active:
          type: boolean
      required:
      - id
      - created_at
      - is_active
    SetupStatus:
      type: object
      additionalProperties: false
      properties:
        initialized:
          type: boolean
        requires_token:
          type: boolean
      required:
