[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "stock-portfolio-manager"
version = "0.1.0"
description = "Self-hosted, auditable Hong Kong and US portfolio accounting"
readme = "readme.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=25,<26",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pyyaml>=6,<7",
  "ruff>=0.11,<1",
  "types-jsonschema>=4.23",
  "types-pyyaml>=6",
]

[project.scripts]
spm-manage = "spm_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/spm_api", "apps/worker/spm_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["spm_api", "spm_worker"]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["dev", ".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["spm_api", "spm_worker"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api", "apps/worker", "scripts", "tests", "migrations/env.py", "migrations/versions"]
plugins = ["pydantic.mypy"]
